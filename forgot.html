<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot page</title>
    <link rel="stylesheet" href="for.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="main">
      <div class="h1">
        <h1><i class="fa-solid fa-lock" style="color: #74C0FC;"></i></h1>
            <h1>forgot password</h1><br>
            <p>you can reset your password here.</p><br>
            <label for="email">Enter your email:</label><br>
            <span><i style="margin-right: -30px; color: #74C0FC;" class="fa-regular fa-envelope"></i><input type="email" id="email" pattern=".+@.com" size="30" required ><br></span>
            <button>reset password</button>
      </div> 
    </div>
</body>
